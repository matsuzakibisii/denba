<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Black glossy body -->
  <rect x="5" y="13" width="54" height="40" rx="8" fill="#111"/>
  <!-- Silver/chrome border -->
  <rect x="5" y="13" width="54" height="40" rx="8" fill="none" stroke="#b8b8b8" stroke-width="2.8"/>
  <!-- Front face inner panel -->
  <rect x="9" y="17" width="46" height="32" rx="6" fill="#1c1c1c"/>
  <!-- Blue oval -->
  <ellipse cx="32" cy="33" rx="18" ry="11.5" fill="none" stroke="#1cb8e8" stroke-width="2"/>
  <!-- DENBA lettering -->
  <text x="32" y="31.5" text-anchor="middle" font-family="Arial Black,sans-serif" font-weight="900" font-size="9" fill="#1cb8e8" letter-spacing=".3">DENBA</text>
  <!-- H -->
  <text x="47" y="27.5" font-family="Arial,sans-serif" font-weight="700" font-size="6" fill="#1cb8e8">H</text>
  <!-- Health -->
  <text x="32" y="40" text-anchor="middle" font-family="Arial,sans-serif" font-size="5" fill="#1cb8e8" letter-spacing="1.2">Health</text>
  <!-- Bottom foot -->
  <rect x="25" y="52" width="14" height="3.5" rx="1.8" fill="#2a2a2a"/>
</svg>
