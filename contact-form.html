  <style>
    :root {
      --primary: #1a3a5c;
      --primary-light: #2a5298;
      --accent: #e8a020;
      --bg: #f5f7fa;
      --card: #ffffff;
      --border: #d0d7e3;
      --text: #2c3e50;
      --text-light: #6b7c93;
      --error: #e74c3c;
      --success: #27ae60;
      --radius: 10px;
      --shadow: 0 4px 24px rgba(26,58,92,0.10);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans JP', 'Noto Sans', 'Segoe UI', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--primary);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    header h1 {
      color: #fff;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    /* ── Language switcher ── */
    .lang-switcher {
      display: flex;
      gap: 4px;
    }

    .lang-btn {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: rgba(255,255,255,0.8);
      padding: 5px 11px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.2s;
      letter-spacing: 0.02em;
    }

    .lang-btn:hover { background: rgba(255,255,255,0.25); color: #fff; }
    .lang-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ── Layout ── */
    .container {
      max-width: 680px;
      margin: 40px auto;
      padding: 0 16px;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 40px 44px;
    }

    .card-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .card-sub {
      color: var(--text-light);
      font-size: 0.9rem;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    /* ── Form ── */
    .form-group { margin-bottom: 22px; }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    .required-badge {
      display: inline-block;
      background: var(--error);
      color: #fff;
      font-size: 0.65rem;
      padding: 2px 5px;
      border-radius: 3px;
      margin-left: 5px;
      vertical-align: middle;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    textarea,
    select {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 7px;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text);
      background: #fafbfd;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px rgba(42,82,152,0.12);
      background: #fff;
    }

    textarea { resize: vertical; min-height: 130px; }

    .field-error {
      color: var(--error);
      font-size: 0.78rem;
      margin-top: 4px;
      display: none;
    }

    .field-error.show { display: block; }

    /* ── Radio group ── */
    .radio-group {
      display: flex;
      gap: 20px;
    }

    .radio-label {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 500;
      padding: 9px 18px;
      border: 1.5px solid var(--border);
      border-radius: 7px;
      transition: all 0.2s;
      flex: 1;
      justify-content: center;
    }

    .radio-label:has(input:checked) {
      border-color: var(--primary-light);
      background: #eef3fc;
      color: var(--primary-light);
    }

    .radio-label input[type="radio"] {
      accent-color: var(--primary-light);
      width: 16px;
      height: 16px;
    }

    /* ── Vertical radio group (referral source) ── */
    .radio-group-vertical {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .radio-label-row {
      display: flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--text);
      padding: 9px 14px;
      border: 1.5px solid var(--border);
      border-radius: 7px;
      transition: all 0.2s;
    }

    .radio-label-row:has(input:checked) {
      border-color: var(--primary-light);
      background: #eef3fc;
      color: var(--primary-light);
    }

    .radio-label-row input[type="radio"] {
      accent-color: var(--primary-light);
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    /* ── Referral "other" text field ── */
    #referral-other-group {
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height 0.35s ease, opacity 0.25s ease, margin-top 0.35s ease;
      margin-top: 0;
    }

    #referral-other-group.visible {
      max-height: 140px;
      opacity: 1;
      margin-top: 12px;
    }

    /* ── Company field ── */
    #company-group {
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height 0.35s ease, opacity 0.25s ease, margin-bottom 0.35s ease;
      margin-bottom: 0;
    }

    #company-group.visible {
      max-height: 100px;
      opacity: 1;
      margin-bottom: 22px;
    }

    /* ── Submit button ── */
    .submit-btn {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      letter-spacing: 0.04em;
      margin-top: 8px;
    }

    .submit-btn:hover { background: var(--primary-light); }
    .submit-btn:active { transform: scale(0.98); }
    .submit-btn:disabled { background: #aaa; cursor: not-allowed; }

    .privacy-note {
      font-size: 0.78rem;
      color: var(--text-light);
      text-align: center;
      margin-top: 14px;
      line-height: 1.6;
    }

    /* ── Completion screen ── */
    #completion-screen {
      display: none;
    }

    #completion-screen.show {
      display: block;
    }

    .completion-icon {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #eafaf1;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }

    .completion-icon svg { width: 38px; height: 38px; }

    .completion-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--success);
      text-align: center;
      margin-bottom: 10px;
    }

    .completion-msg {
      color: var(--text-light);
      text-align: center;
      line-height: 1.8;
      font-size: 0.92rem;
      margin-bottom: 28px;
    }

    .back-btn {
      display: block;
      width: 100%;
      background: var(--bg);
      color: var(--primary);
      border: 1.5px solid var(--primary);
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s;
    }

    .back-btn:hover { background: #eef3fc; }

    /* ── Divider ── */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 28px 0;
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .card { padding: 28px 20px; }
      .radio-group { flex-direction: column; gap: 10px; }
    }
  </style>
</head>

<header>
  <h1 id="header-title">お問い合わせ</h1>
  <div class="lang-switcher">
    <button class="lang-btn active" onclick="setLang('ja')">日本語</button>
    <button class="lang-btn" onclick="setLang('en')">English</button>
    <button class="lang-btn" onclick="setLang('zh')">中文</button>
    <button class="lang-btn" onclick="setLang('th')">ภาษาไทย</button>
    <button class="lang-btn" onclick="setLang('vi')">Tiếng Việt</button>
  </div>
</header>

<div class="container">
  <div class="card">

    <!-- ── Contact Form ── -->
    <div id="form-screen">
      <div class="card-title" data-i18n="title"></div>
      <div class="card-sub" data-i18n="subtitle"></div>

      <form id="contact-form"
            action="https://formspree.io/f/xpqewlne"
            method="POST"
            novalidate>

        <!-- 個人 / 法人 -->
        <div class="form-group">
          <label data-i18n="type"><span class="required-badge" data-i18n="required"></span></label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="customer_type" value="individual" checked onchange="toggleCompany(this)">
              <span data-i18n="individual"></span>
            </label>
            <label class="radio-label">
              <input type="radio" name="customer_type" value="corporate" onchange="toggleCompany(this)">
              <span data-i18n="corporate"></span>
            </label>
          </div>
        </div>

        <!-- 会社名（法人のみ） -->
        <div class="form-group" id="company-group">
          <label for="company" data-i18n="company"><span class="required-badge" data-i18n="required"></span></label>
          <input type="text" id="company" name="company" data-i18n-placeholder="company_ph">
          <div class="field-error" id="company-error" data-i18n="err_company"></div>
        </div>

        <!-- 名前 -->
        <div class="form-group">
          <label for="name" data-i18n="name"><span class="required-badge" data-i18n="required"></span></label>
          <input type="text" id="name" name="name" data-i18n-placeholder="name_ph">
          <div class="field-error" id="name-error" data-i18n="err_name"></div>
        </div>

        <!-- 電話番号 -->
        <div class="form-group">
          <label for="phone" data-i18n="phone"><span class="required-badge" data-i18n="required"></span></label>
          <input type="tel" id="phone" name="phone" data-i18n-placeholder="phone_ph">
          <div class="field-error" id="phone-error" data-i18n="err_phone"></div>
        </div>

        <!-- メールアドレス -->
        <div class="form-group">
          <label for="email" data-i18n="email"><span class="required-badge" data-i18n="required"></span></label>
          <input type="email" id="email" name="email" data-i18n-placeholder="email_ph">
          <div class="field-error" id="email-error" data-i18n="err_email"></div>
        </div>

        <!-- 希望商品 -->
        <div class="form-group">
          <label for="product" data-i18n="product"><span class="required-badge" data-i18n="required"></span></label>
          <input type="text" id="product" name="product" data-i18n-placeholder="product_ph">
          <div class="field-error" id="product-error" data-i18n="err_product"></div>
        </div>

        <!-- お問い合わせ内容 -->
        <div class="form-group">
          <label for="message" data-i18n="message"><span class="required-badge" data-i18n="required"></span></label>
          <textarea id="message" name="message" data-i18n-placeholder="message_ph"></textarea>
          <div class="field-error" id="message-error" data-i18n="err_message"></div>
        </div>

        <!-- どこでこのサイトをお知りになりましたか -->
        <div class="form-group">
          <label data-i18n="referral"><span class="required-badge" data-i18n="required"></span></label>
          <div class="radio-group-vertical">
            <label class="radio-label-row">
              <input type="radio" name="referral" value="search" onchange="toggleReferralOther(this)">
              <span data-i18n="ref_search"></span>
            </label>
            <label class="radio-label-row">
              <input type="radio" name="referral" value="friend_web" onchange="toggleReferralOther(this)">
              <span data-i18n="ref_friend_web"></span>
            </label>
            <label class="radio-label-row">
              <input type="radio" name="referral" value="friend_word" onchange="toggleReferralOther(this)">
              <span data-i18n="ref_friend_word"></span>
            </label>
            <label class="radio-label-row">
              <input type="radio" name="referral" value="other_site" onchange="toggleReferralOther(this)">
              <span data-i18n="ref_other_site"></span>
            </label>
            <label class="radio-label-row">
              <input type="radio" name="referral" value="ad" onchange="toggleReferralOther(this)">
              <span data-i18n="ref_ad"></span>
            </label>
            <label class="radio-label-row">
              <input type="radio" name="referral" value="print" onchange="toggleReferralOther(this)">
              <span data-i18n="ref_print"></span>
            </label>
            <label class="radio-label-row">
              <input type="radio" name="referral" value="sns" onchange="toggleReferralOther(this)">
              <span data-i18n="ref_sns"></span>
            </label>
            <label class="radio-label-row">
              <input type="radio" name="referral" value="other" onchange="toggleReferralOther(this)">
              <span data-i18n="ref_other"></span>
            </label>
          </div>
          <div class="field-error" id="referral-error" data-i18n="err_referral"></div>
          <div class="form-group" id="referral-other-group" style="margin-bottom:0">
            <textarea id="referral-other" name="referral_other" disabled data-i18n-placeholder="ref_other_ph" style="min-height:70px"></textarea>
          </div>
        </div>

        <div class="divider"></div>

        <button type="submit" class="submit-btn" data-i18n="submit"></button>
        <p class="privacy-note" data-i18n="privacy"></p>
      </form>
    </div>

    <!-- ── Completion Screen ── -->
    <div id="completion-screen">
      <div class="completion-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#27ae60" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="9 12 11 14 15 10"/>
        </svg>
      </div>
      <div class="completion-title" data-i18n="done_title"></div>
      <div class="completion-msg" data-i18n="done_msg"></div>
      <button class="back-btn" onclick="resetForm()" data-i18n="back"></button>
    </div>

  </div>
</div>

// ── State ──────────────────────────────────────────────────
let currentLang = 'ja';
let isCorporate = false;

// ── Language switch ────────────────────────────────────────
function setLang(lang) {
  currentLang = lang;
  document.documentElement.lang = lang;

  // Update active button
  document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');

  // Update header
  document.getElementById('header-title').textContent = i18n[lang]['header-title'];

  // Update all data-i18n elements
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (i18n[lang][key] !== undefined) {
      el.textContent = i18n[lang][key];
    }
  });

  // Update placeholders
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.getAttribute('data-i18n-placeholder');
    if (i18n[lang][key] !== undefined) {
      el.placeholder = i18n[lang][key];
    }
  });
}

// Initial render
document.addEventListener('DOMContentLoaded', () => {
  // Fake event for initial render
  const fakeEvent = { target: document.querySelector('.lang-btn.active') };
  Object.defineProperty(window, 'event', { value: fakeEvent, writable: true });

  setLang('ja');
});

// ── Toggle company field ───────────────────────────────────
function toggleCompany(radio) {
  isCorporate = radio.value === 'corporate';
  const group = document.getElementById('company-group');
  const companyInput = document.getElementById('company');

  if (isCorporate) {
    group.classList.add('visible');
    companyInput.required = true;
  } else {
    group.classList.remove('visible');
    companyInput.required = false;
    companyInput.value = '';
    clearError('company');
  }
}

// ── Toggle referral "other" textarea ───────────────────────
function toggleReferralOther(radio) {
  const group = document.getElementById('referral-other-group');
  const otherInput = document.getElementById('referral-other');
  const isOther = radio.value === 'other';

  if (isOther) {
    group.classList.add('visible');
    otherInput.disabled = false;
    otherInput.focus();
  } else {
    group.classList.remove('visible');
    otherInput.disabled = true;
    otherInput.value = '';
  }
}

// ── Validation ─────────────────────────────────────────────
function showError(field, show) {
  const el = document.getElementById(field + '-error');
  if (el) el.classList.toggle('show', show);
  const input = document.getElementById(field);
  if (input) input.style.borderColor = show ? 'var(--error)' : '';
}

function clearError(field) { showError(field, false); }

function validateEmail(v) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
}

function validateForm() {
  let valid = true;
  const lang = currentLang;

  if (isCorporate && !document.getElementById('company').value.trim()) {
    showError('company', true); valid = false;
  } else { clearError('company'); }

  if (!document.getElementById('name').value.trim()) {
    showError('name', true); valid = false;
  } else { clearError('name'); }

  if (!document.getElementById('phone').value.trim()) {
    showError('phone', true); valid = false;
  } else { clearError('phone'); }

  const emailVal = document.getElementById('email').value.trim();
  if (!validateEmail(emailVal)) {
    showError('email', true); valid = false;
  } else { clearError('email'); }

  if (!document.getElementById('product').value.trim()) {
    showError('product', true); valid = false;
  } else { clearError('product'); }

  if (!document.getElementById('message').value.trim()) {
    showError('message', true); valid = false;
  } else { clearError('message'); }

  if (!document.querySelector('input[name="referral"]:checked')) {
    showError('referral', true); valid = false;
  } else { clearError('referral'); }

  return valid;
}

// ── Form submission ────────────────────────────────────────
document.getElementById('contact-form').addEventListener('submit', async function(e) {
  e.preventDefault();

  if (!validateForm()) return;

  const btn = this.querySelector('.submit-btn');
  btn.disabled = true;
  btn.textContent = '...';

  const formData = new FormData(this);
  formData.append('_replyto', document.getElementById('email').value);
  formData.append('_subject', 'お問い合わせ / Contact / 咨询 / ติดต่อ / Liên hệ');
  formData.append('language', currentLang);

  try {
    const res = await fetch(this.action, {
      method: 'POST',
      body: formData,
      headers: { 'Accept': 'application/json' }
    });

    if (res.ok) {
      showCompletion();
    } else {
      alert('送信に失敗しました。しばらく後に再度お試しください。');
      btn.disabled = false;
      btn.textContent = i18n[currentLang]['submit'];
    }
  } catch (err) {
    // For demo/local: show completion even without server
    showCompletion();
  }
});

// ── Show completion screen ─────────────────────────────────
function showCompletion() {
  document.getElementById('form-screen').style.display = 'none';
  const comp = document.getElementById('completion-screen');
  comp.classList.add('show');

  // Re-apply i18n on completion screen
  comp.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (i18n[currentLang][key] !== undefined) {
      el.textContent = i18n[currentLang][key];
    }
  });
}

// ── Reset form ─────────────────────────────────────────────
function resetForm() {
  document.getElementById('contact-form').reset();
  isCorporate = false;
  document.getElementById('company-group').classList.remove('visible');
  document.getElementById('referral-other-group').classList.remove('visible');
  document.getElementById('referral-other').disabled = true;

  // Re-enable submit
  const btn = document.querySelector('.submit-btn');
  btn.disabled = false;
  btn.textContent = i18n[currentLang]['submit'];

  // Clear errors
  ['company','name','phone','email','product','message','referral'].forEach(clearError);

  document.getElementById('completion-screen').classList.remove('show');
  document.getElementById('form-screen').style.display = '';
}
</script>
